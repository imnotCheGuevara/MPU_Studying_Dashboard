name: Windows

on:
  push:
    branches:
      - codex/windows-port
    paths-ignore:
      - ".agent/**"
      - "docs/**"
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    # Swift 6.1 ships Clang 19. Pin the runner while windows-latest carries
    # Visual Studio 18's STL, which requires Clang 20 for C++ dependencies.
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Visual Studio environment
        uses: seanmiddleditch/gha-setup-vsdevenv@v5

      - name: Install Swift
        uses: compnerd/gha-setup-swift@v0.3.0
        with:
          branch: swift-6.1-release
          tag: 6.1-RELEASE

      - name: Cache Swift build products
        uses: actions/cache@v4
        with:
          path: .build
          key: windows-2022-swift-6.1-v1-${{ hashFiles('Package.swift', 'Bundler.toml') }}
          restore-keys: |
            windows-2022-swift-6.1-v1-

      - name: Show Swift version
        run: swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build Windows release
        run: swift build -c release --product CampusDashboardWindows

      - name: Run Windows tests
        run: swift test -c release

      - name: Build portable bundle
        run: |
          $ErrorActionPreference = "Stop"
          $bundlerSource = Join-Path $env:RUNNER_TEMP "swift-bundler"
          git clone --filter=blob:none https://github.com/moreSwift/swift-bundler.git $bundlerSource
          git -C $bundlerSource checkout 182fbd7f50a3c2ac1efd69659aac4f55605ca718
          $env:SBUN_NO_SCHEMA_GEN = "1"
          $bundlerScratch = Join-Path (Resolve-Path ".build") "swift-bundler-tool"
          swift build -c release --package-path $bundlerSource --scratch-path $bundlerScratch --product swift-bundler
          $bundlerBin = swift build -c release --package-path $bundlerSource --scratch-path $bundlerScratch --show-bin-path
          $swiftExecutable = (Get-Command swift -ErrorAction Stop).Source
          $swiftBin = Split-Path $swiftExecutable -Parent
          $swiftUSR = Split-Path $swiftBin -Parent
          $swiftToolchain = Split-Path $swiftUSR -Parent
          $bundlerExecutable = Join-Path $bundlerBin "swift-bundler.exe"
          & $bundlerExecutable bundle CampusDashboard --bundler windowsGeneric --toolchain $swiftToolchain -c release
          if ($LASTEXITCODE -ne 0) {
            throw "swift-bundler failed with exit code $LASTEXITCODE"
          }

          $bundleRoot = ".build/bundler/apps/CampusDashboard"
          $portableSource = Join-Path $bundleRoot "CampusDashboard.generic"
          if (-not (Test-Path $portableSource -PathType Container)) {
            throw "Expected portable bundle was not produced at $portableSource"
          }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path "$portableSource/*" -DestinationPath "artifacts/CampusDashboard-Windows-0.1.0-portable-x64.zip"

          Get-ChildItem artifacts -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii artifacts/SHA256SUMS.txt

          Get-Content artifacts/SHA256SUMS.txt

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: CampusDashboard-Windows-0.1.0
          path: artifacts
          if-no-files-found: error
