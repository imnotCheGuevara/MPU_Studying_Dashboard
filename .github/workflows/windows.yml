name: Windows

on:
  push:
    branches:
      - codex/windows-port
    paths-ignore:
      - ".agent/**"
      - "docs/**"
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    # Swift 6.1 ships Clang 19. Pin the runner while windows-latest carries
    # Visual Studio 18's STL, which requires Clang 20 for C++ dependencies.
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Visual Studio environment
        uses: seanmiddleditch/gha-setup-vsdevenv@v5

      - name: Install Swift
        uses: compnerd/gha-setup-swift@v0.3.0
        with:
          branch: swift-6.1-release
          tag: 6.1-RELEASE

      - name: Restore Swift build products
        id: swift-cache
        uses: actions/cache/restore@v4
        with:
          path: .build
          key: windows-2022-swift-6.1-v2-${{ hashFiles('Package.swift', 'Package.resolved', 'Bundler.toml', 'Sources/**/*.swift', 'Tests/**/*.swift') }}
          restore-keys: |
            windows-2022-swift-6.1-v2-

      - name: Show Swift version
        run: swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build Windows release
        run: swift build -c release --product CampusDashboardWindows

      - name: Run Windows tests
        run: swift test -c release

      - name: Resolve Windows packaging tools
        run: |
          $windowsKitsBin = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
          $manifestTool = Get-ChildItem $windowsKitsBin -Filter mt.exe -Recurse -File |
            Where-Object { $_.Directory.Name -eq "x64" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $manifestTool) {
            throw "Windows SDK Manifest Tool (mt.exe) was not found under $windowsKitsBin"
          }
          $dumpbinTool = Get-Command dumpbin.exe -ErrorAction Stop
          $manifestTool.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "WINDOWS_MT_EXE=$($manifestTool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_DUMPBIN_EXE=$($dumpbinTool.Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows packaging tool
        run: |
          $ErrorActionPreference = "Stop"
          $bundlerSource = Join-Path $env:RUNNER_TEMP "swift-bundler"
          git clone --filter=blob:none https://github.com/moreSwift/swift-bundler.git $bundlerSource
          git -C $bundlerSource checkout 182fbd7f50a3c2ac1efd69659aac4f55605ca718

          # The pinned bundler reads only the title-cased Windows `Path` key
          # while GitHub Actions can expose it as `PATH`. Keep the upstream fix
          # local to this deterministic CI checkout.
          $windowsBundler = Join-Path $bundlerSource "Sources\SwiftBundler\Bundler\GenericWindowsBundler.swift"
          $bundlerSourceText = [System.IO.File]::ReadAllText($windowsBundler)
          $oldPathLookup = 'let pathVar = ProcessInfo.processInfo.environment["Path"] ?? ""'
          $newPathLookup = 'let pathVar = ProcessInfo.processInfo.environment["Path"] ?? ProcessInfo.processInfo.environment["PATH"] ?? ""'
          if (-not $bundlerSourceText.Contains($oldPathLookup)) {
            throw "Pinned swift-bundler PATH lookup changed unexpectedly"
          }
          [System.IO.File]::WriteAllText($windowsBundler, $bundlerSourceText.Replace($oldPathLookup, $newPathLookup))

          # --skip-build should reuse this workflow's tested release product,
          # but project dependencies such as Windows App Runtime still need
          # to be prepared by swift-bundler.
          $bundleCommand = Join-Path $bundlerSource "Sources\SwiftBundler\Commands\BundleCommand.swift"
          $bundleCommandText = [System.IO.File]::ReadAllText($bundleCommand)
          $oldDependencyDryRun = 'dryRun: skipBuild || arguments.skipDependencies'
          $newDependencyDryRun = 'dryRun: arguments.skipDependencies'
          if (-not $bundleCommandText.Contains($oldDependencyDryRun)) {
            throw "Pinned swift-bundler dependency preparation changed unexpectedly"
          }
          [System.IO.File]::WriteAllText($bundleCommand, $bundleCommandText.Replace($oldDependencyDryRun, $newDependencyDryRun))

          $env:SBUN_NO_SCHEMA_GEN = "1"
          $bundlerScratch = Join-Path (Resolve-Path ".build") "swift-bundler-tool"
          $bundlerBin = swift build -c release --package-path $bundlerSource --scratch-path $bundlerScratch --show-bin-path
          $bundlerExecutable = Join-Path $bundlerBin "swift-bundler.exe"
          if (-not (Test-Path $bundlerExecutable -PathType Leaf)) {
            swift build -c release --package-path $bundlerSource --scratch-path $bundlerScratch --product swift-bundler
          }
          if (-not (Test-Path $bundlerExecutable -PathType Leaf)) {
            throw "swift-bundler executable was not produced"
          }
          $swiftExecutable = (Get-Command swift -ErrorAction Stop).Source
          $swiftBin = Split-Path $swiftExecutable -Parent
          $swiftUSR = Split-Path $swiftBin -Parent
          $swiftToolchain = Split-Path $swiftUSR -Parent
          "SWIFT_BUNDLER_EXE=$bundlerExecutable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SWIFT_TOOLCHAIN=$swiftToolchain" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Save Swift build products
        if: steps.swift-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build
          key: windows-2022-swift-6.1-v2-${{ hashFiles('Package.swift', 'Package.resolved', 'Bundler.toml', 'Sources/**/*.swift', 'Tests/**/*.swift') }}

      - name: Build portable bundle
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path $env:WINDOWS_MT_EXE -PathType Leaf)) {
            throw "Resolved Windows SDK Manifest Tool is unavailable"
          }
          if (-not (Test-Path $env:WINDOWS_DUMPBIN_EXE -PathType Leaf)) {
            throw "Resolved Visual Studio dumpbin tool is unavailable"
          }

          # swift-bundler invokes these tools through cmd.exe. Exact ephemeral
          # wrappers avoid depending on Foundation's environment-key casing.
          $mtWrapper = Join-Path (Resolve-Path ".") "mt.cmd"
          $dumpbinWrapper = Join-Path (Resolve-Path ".") "dumpbin.cmd"
          "@`"$env:WINDOWS_MT_EXE`" %*" | Set-Content -Path $mtWrapper -Encoding ascii
          "@`"$env:WINDOWS_DUMPBIN_EXE`" %*" | Set-Content -Path $dumpbinWrapper -Encoding ascii
          $productsDirectory = swift build -c release --show-bin-path
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $productsDirectory -PathType Container)) {
            throw "Unable to resolve the existing Windows release products directory"
          }
          & $env:SWIFT_BUNDLER_EXE bundle CampusDashboard --bundler windowsGeneric --toolchain $env:SWIFT_TOOLCHAIN -c release --skip-build --products-directory $productsDirectory
          $bundlerExitCode = $LASTEXITCODE
          Remove-Item $mtWrapper, $dumpbinWrapper -Force
          if ($bundlerExitCode -ne 0) {
            throw "swift-bundler failed with exit code $bundlerExitCode"
          }

          $bundleRoot = ".build/bundler/apps/CampusDashboard"
          $portableSource = Join-Path $bundleRoot "CampusDashboard.generic"
          if (-not (Test-Path $portableSource -PathType Container)) {
            throw "Expected portable bundle was not produced at $portableSource"
          }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path "$portableSource/*" -DestinationPath "artifacts/CampusDashboard-Windows-0.1.0-portable-x64.zip"

          Get-ChildItem artifacts -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii artifacts/SHA256SUMS.txt

          Get-Content artifacts/SHA256SUMS.txt

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: CampusDashboard-Windows-0.1.0
          path: artifacts
          if-no-files-found: error
